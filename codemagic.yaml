# Codemagic — Elix Star Live (old app)
# Repo: https://github.com/ElixStarLive/-Elix-Star-Live
#
# Native iOS is Capacitor + CocoaPods (ios/App/App.xcworkspace).
# Not SPM / CapApp-SPM — do not copy New-app SPM steps here.
#
# Signing (account Code signing identities — reuse existing, do not recreate):
#   - ElixStarLive-Distribution.p12
#   - App Store .mobileprovision for com.elixstarlive.app
# Team: 74Y7WAZVUV
#
# iOS deployment target is 15.0 because @capgo/native-purchases requires it
# (CapgoNativePurchases.podspec: s.ios.deployment_target = '15.0').

workflows:
  ios-unsigned:
    name: iOS compile check (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web + sync Capacitor iOS
        script: |
          npm run build:ios
      - name: Xcode build (no signing)
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-signed-ipa:
    name: iOS signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elixstarlive.app
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.elixstarlive.app
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web + sync Capacitor iOS
        script: |
          npm run build:ios
      - name: Set up keychain + code signing
        script: |
          keychain initialize
          keychain add-certificates
          echo "==== Codesigning identities in keychain ===="
          security find-identity -v -p codesigning
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build signed IPA
        script: |
          set +e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=74Y7WAZVUV"
          status=$?
          if [ $status -ne 0 ]; then
            echo "==== ARCHIVE FAILED — extracting Xcode errors ===="
            security find-identity -v -p codesigning || true
            for f in /tmp/xcodebuild_logs/*.log; do
              [ -f "$f" ] || continue
              echo "---- $f ----"
              grep -E "error:|ARCHIVE FAILED|Provisioning profile|Code signature|No profiles|fatal error|CocoaPods" "$f" | tail -n 100 || true
              echo "---- tail $f ----"
              tail -n 60 "$f" || true
            done
            exit $status
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elixstarlive.app
      groups:
        - app_store_credentials
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.elixstarlive.app
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web + sync Capacitor iOS
        script: |
          npm run build:ios
      - name: Set up keychain + code signing
        script: |
          keychain initialize
          keychain add-certificates
          echo "==== Codesigning identities in keychain ===="
          security find-identity -v -p codesigning
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build signed IPA
        script: |
          set +e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist \
            --archive-flags="-destination 'generic/platform=iOS' CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=74Y7WAZVUV"
          status=$?
          if [ $status -ne 0 ]; then
            echo "==== ARCHIVE FAILED — extracting Xcode errors ===="
            security find-identity -v -p codesigning || true
            for f in /tmp/xcodebuild_logs/*.log; do
              [ -f "$f" ] || continue
              echo "---- $f ----"
              grep -E "error:|ARCHIVE FAILED|Provisioning profile|Code signature|No profiles|fatal error|CocoaPods" "$f" | tail -n 100 || true
              echo "---- tail $f ----"
              tail -n 60 "$f" || true
            done
            exit $status
          fi
      - name: Upload IPA to App Store Connect
        script: |
          set -e
          IPA_PATH="$(ls build/ios/ipa/*.ipa ios/App/build/ios/ipa/*.ipa 2>/dev/null | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found to upload"
            find . -name '*.ipa' -print || true
            exit 1
          fi
          echo "IPA: $IPA_PATH"

          if [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ] || [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "ERROR: Attach Codemagic group app_store_credentials (existing keys — do not create new Apple certs)"
            exit 1
          fi

          python3 - <<'PY'
          import os, re, pathlib, base64, sys
          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          raw = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"]
          text = raw.strip()
          if "BEGIN PRIVATE KEY" not in text:
              text = base64.b64decode(text).decode("utf-8")
          body = text.replace("-----BEGIN PRIVATE KEY-----", "").replace("-----END PRIVATE KEY-----", "")
          body = re.sub(r"\s+", "", body)
          if len(body) < 80:
              print("ERROR: APP_STORE_CONNECT_PRIVATE_KEY truncated or invalid")
              sys.exit(1)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          folder = pathlib.Path.home() / ".appstoreconnect" / "private_keys"
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / f"AuthKey_{key_id}.p8"
          path.write_text(pem, encoding="utf-8")
          print(f"Wrote {path}")
          PY

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
